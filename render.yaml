services:
  - type: web
    name: outrovo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      # Set these in Render > Environment before launch; `sync: false` means
      # they are read from the dashboard. The app fails closed when unset.
      - key: ADMIN_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: outbound@yourdomain.com
      # Encrypts stored sender-account passwords. MUST be set before users
      # connect inboxes — changing it later makes stored passwords unreadable.
      - key: DATA_KEY
        sync: false
      # Absolute base URL used in List-Unsubscribe links and integration
      # callback URLs inside outbound emails.
      - key: PUBLIC_URL
        value: https://outrovo.onrender.com
      - key: RESEND_API_KEY
        sync: false
      # Powers the landing-page "Ask us" assistant (POST /api/assistant) plus
      # the in-app AI sequence writer, site-scan prefill, reply-intent, and
      # reply drafts. Set in Render > Environment. Without it the assistant
      # uses its built-in keyword answers and the other AI features fall back
      # to heuristics — nothing breaks, it just isn't as smart.
      - key: LLM_API_KEY
        sync: false
      # Optional: point at any OpenAI-compatible endpoint (default OpenAI).
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DATA_DIR
        value: /var/data
